<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13251d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="峇里島 2026">
  <meta name="description" content="2026 峇里島、泗水與新加坡離線旅行導覽">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app.css">
  <title>峇里島 涵威活該沒玩到</title>
</head>
<body>
  <main class="app-shell" id="app">
    <section class="view is-active" data-view="today" aria-labelledby="today-title">
      <header class="cover">
        <div class="cover__shade"></div>
        <div class="cover__top"><span>印尼・2026</span><button class="offline-pill" id="offline-state" type="button" aria-live="polite" aria-controls="install-card" aria-label="離線狀態；點擊顯示 App 安裝方式">正在準備離線內容</button></div>
        <div class="cover__copy"><p class="eyebrow">9 天旅程</p><h1 id="today-title"><span>峇里島</span> <span>涵威活該沒玩到</span></h1><p>峇里島 · 泗水 · 新加坡</p></div>
      </header>
      <section class="trip-status" id="trip-status"></section>
      <section class="section-block" id="today-content"></section>
    </section>
    <section class="view page-view" data-view="trip" aria-labelledby="trip-title">
      <header class="page-header"><span class="eyebrow">9 月 26 日 — 10 月 4 日</span><h1 id="trip-title">九日旅程</h1><p>主行程、景點間交通、預約提醒與每日備案。</p></header>
      <div class="day-list" id="day-list"></div>
    </section>
    <section class="view page-view" data-view="explore" aria-labelledby="explore-title">
      <header class="page-header"><span class="eyebrow">探索</span><h1 id="explore-title">全部安排</h1><p>依地區、分類與安排狀態查看主行程、備案及未排日景點。</p></header>
      <div class="explore-filters" id="place-filters" aria-label="地區與分類篩選"></div>
      <div class="place-list" id="place-list"></div>
    </section>
    <section class="view page-view" data-view="prepare" aria-labelledby="prepare-title">
      <header class="page-header page-header--dark"><span class="eyebrow">出發前</span><h1 id="prepare-title">行前準備</h1><p>全團準備進度與我的打包清單。</p></header>
      <div class="info-content" id="prepare-content"></div>
    </section>
    <section class="view page-view" data-view="info" aria-labelledby="info-title">
      <header class="page-header page-header--dark"><span class="eyebrow">隨身資料</span><h1 id="info-title">重要資訊</h1><p>共用地圖、航班、住宿與離線資訊。</p></header>
      <div class="info-content" id="info-content"></div>
    </section>
  </main>
  <aside class="install-toast" id="install-card" aria-labelledby="install-card-title" hidden>
    <span class="install-toast__mark" aria-hidden="true">↓</span>
    <div class="install-toast__copy">
      <strong id="install-card-title">可加入主畫面</strong>
      <p id="install-card-copy">離線也能查看旅程</p>
    </div>
    <button class="install-toast__button" id="install-button" type="button">安裝</button>
    <button class="install-toast__dismiss" id="install-dismiss" type="button" aria-label="關閉安裝提示">×</button>
  </aside>
  <nav class="bottom-nav" aria-label="主要導覽">
    <button data-target="today" class="is-active"><span aria-hidden="true">◉</span>今日</button>
    <button data-target="trip"><span aria-hidden="true">▤</span>旅程</button>
    <button data-target="explore"><span aria-hidden="true">◇</span>探索</button>
    <button data-target="prepare"><span aria-hidden="true">✓</span>準備</button>
    <button data-target="info"><span aria-hidden="true">≡</span>資訊</button>
  </nav>
  <dialog class="detail-sheet" id="detail-dialog"><div class="sheet-handle"></div><button class="sheet-close" aria-label="關閉">×</button><div id="detail-content"></div></dialog>
  <script src="trip-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
